{% extends 'base.html' %}
{% block title %}{{ action }} Firm{% endblock %}
{% block page_title %}{{ action }} Firm{% endblock %}
{% block content %}
<div class="card" style="max-width:600px">
  <div class="card-header"><h2>{{ action }} Firm</h2></div>
  <form method="POST">
    <div class="form-group"><label>Firm Name *</label><input type="text" name="firm_name" class="form-control" value="{{ firm.firm_name if firm else '' }}" required></div>
    <div class="form-group" style="margin-top:14px"><label>GST No</label><input type="text" name="firm_gst_no" class="form-control" value="{{ firm.firm_gst_no if firm else '' }}"></div>
    <div class="form-group" style="margin-top:14px"><label>Mobile</label><input type="text" name="firm_mobile" class="form-control" value="{{ firm.firm_mobile if firm else '' }}"></div>
    <div class="form-group" style="margin-top:14px"><label>Address</label><textarea name="firm_address" class="form-control" rows="3">{{ firm.firm_address if firm else '' }}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <a href="/firms/" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </div>
  </form>
</div>
{% endblock %}
