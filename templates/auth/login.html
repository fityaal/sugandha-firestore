<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – Sugandha Enterprises</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:linear-gradient(135deg,#1a2744 0%,#0f1829 50%,#1a2744 100%)}
.bg-pattern{position:fixed;inset:0;opacity:.04;
  background-image:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%);
  background-size:20px 20px;pointer-events:none}
.login-box{background:#fff;border-radius:16px;width:100%;max-width:420px;
           box-shadow:0 25px 60px rgba(0,0,0,.4);overflow:hidden;position:relative;z-index:1}
.login-header{background:linear-gradient(135deg,#1a2744,#2563eb);padding:36px 32px 28px;text-align:center;color:#fff}
.login-header .logo{width:64px;height:64px;background:rgba(255,255,255,.15);
                    border-radius:14px;display:flex;align-items:center;justify-content:center;
                    margin:0 auto 14px;backdrop-filter:blur(4px)}
.login-header .logo i{font-size:28px;color:#fff}
.login-header h1{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px}
.login-header p{font-size:12px;opacity:.75;margin-top:4px;letter-spacing:.5px}
.login-body{padding:32px}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;
       display:flex;align-items:center;gap:8px;background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#6b7a99;
                  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);
              color:#9ca3af;font-size:14px}
.form-control{width:100%;padding:11px 12px 11px 38px;border:1.5px solid #dde3f0;
              border-radius:8px;font-size:14px;color:#1e2a42;font-family:'Noto Sans',sans-serif;
              transition:.2s;background:#fff}
.form-control:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#1a2744,#2563eb);
           color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;
           font-family:'Rajdhani',sans-serif;letter-spacing:1px;cursor:pointer;
           transition:.2s;margin-top:4px}
.btn-login:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,235,.4)}
.login-footer{text-align:center;padding:16px 32px;background:#f8faff;
              border-top:1px solid #dde3f0;font-size:12px;color:#9ca3af}
.hint{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:6px;
      padding:10px 14px;font-size:12px;color:#1e40af;margin-top:16px}
.hint strong{display:block;margin-bottom:2px}
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="login-box">
  <div class="login-header">
    <div class="logo"><i class="fa-solid fa-mobile-screen"></i></div>
    <h1>SUGANDHA ENTERPRISES</h1>
    <p>SHOP MANAGEMENT SYSTEM</p>
  </div>
  <div class="login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="username" class="form-control"
                 placeholder="Enter username" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" class="form-control"
                 placeholder="Enter password" required>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="fa-solid fa-right-to-bracket"></i> &nbsp;LOGIN
      </button>
      <div class="hint">
        <strong>Default credentials:</strong>
        </div>
    </form>
  </div>
  <div class="login-footer">Sugandha Enterprises &copy; {{ now_year }} &nbsp;|&nbsp; All rights reserved</div>
</div>
</body>
</html>
