{% extends 'base.html' %}
{% block title %}{{ action }} Item{% endblock %}
{% block page_title %}{{ action }} Item{% endblock %}
{% block content %}
<div class="card" style="max-width:500px">
  <div class="card-header"><h2>{{ action }} Item</h2></div>
  <form method="POST">
    <div class="form-group"><label>Item Name *</label><input type="text" name="item_name" class="form-control" value="{{ item.item_name if item else '' }}" required></div>
    <div class="form-group" style="margin-top:14px"><label>HSN Code</label><input type="text" name="hsn" class="form-control" value="{{ item.hsn if item else '' }}" placeholder="85171300"></div>
    <div class="form-group" style="margin-top:14px"><label>GST %</label>
      <select name="gst_percent" class="form-control">
        {% for g in [0,5,12,18,28] %}
        <option value="{{ g }}" {% if item and item.gst_percent==g %}selected{% elif not item and g==12 %}selected{% endif %}>{{ g }}%</option>
        {% endfor %}
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <a href="/items/" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </div>
  </form>
</div>
{% endblock %}
